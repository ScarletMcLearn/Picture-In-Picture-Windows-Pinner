[General]
; 500-2000 recommended. Lower catches PiP faster; higher uses less CPU.
PollIntervalMs=750
; 0 = only concise rolling log. 1 = detector reasons also logged.
VerboseLogging=0
; Current VirtualDesktopAccessor upstream testing ends at build 26200.8117.
; Keep 0 unless you manually validate the upstream DLL on a newer Windows build.
AllowUnverifiedOsBuild=0

[Detection]
; Match is intentionally conservative: browser + PiP title + PiP-like window traits.
; Add localized PiP titles here, separated by |, if browser UI is not English.
TitlePatterns=Picture-in-Picture|Picture in Picture|PiP
MinWidth=120
MinHeight=80
MaxWidth=1600
MaxHeight=1200
